apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: t-ayusgupta-st
  namespace: argocd
spec:
  project: default
  source:
    repoURL: oci://ghcr.io/stefanprodan/charts
    chart: podinfo
    targetRevision: 6.9.3
    helm:
      releaseName: 97f3e261acdb9a662ecae7c72df5be652eb25332
      values: |
          AppName: PriceDetector
          TemperatureRangeMax: 85
          ErrorThreshold: 5
          HealthCheckEndpoint: https://health.example.com
          EnableLocalLog: true
          AgentEndpoint: https://agent.example.com
          HealthCheckEnabled: true
          ApplicationEndpoint: https://app.example.com
  destination:
    server: https://kubernetes.default.svc
    namespace: new
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
